apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: helep
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: user-service
        static_configs:
          - targets: ["user-service:8001"]

      - job_name: sos-service
        static_configs:
          - targets: ["sos-service:8002"]

      - job_name: dispatch-service
        static_configs:
          - targets: ["dispatch-service:8003"]

      - job_name: notification-service
        static_configs:
          - targets: ["notification-service:8004"]

      - job_name: analytics-service
        static_configs:
          - targets: ["analytics-service:8005"]
